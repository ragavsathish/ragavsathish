description: RDF fit assistant evals

prompts:
  - "{{question}}"

providers:
  - id: file://evals/rdf-fit-provider.mjs

tests:
  - vars:
      question: Is Sathish suitable for a medtech founder program?
    assert:
      - type: javascript
        value: JSON.parse(output).fit === 'Strong' && JSON.parse(output).target === 'MedTech founder / biodesign program'
      - type: contains
        value: domain:MedicalDeviceSoftware
      - type: contains
        value: role:ScopeImpactTechnologyLead
      - type: not-contains
        value: '"fit": "Weak"'

  - vars:
      question: Would Sathish fit a health AI product lead role?
    assert:
      - type: javascript
        value: JSON.parse(output).fit === 'Strong' && JSON.parse(output).target === 'Health AI product / technology lead'
      - type: contains
        value: domain:AIEnabledHealthcare
      - type: contains
        value: project:HallaHealth

  - vars:
      question: Is Sathish suitable for cloud platform architect roles?
    assert:
      - type: javascript
        value: JSON.parse(output).fit === 'Strong' && JSON.parse(output).target === 'Cloud platform / regulated infrastructure architect'
      - type: contains
        value: skill:AWS
      - type: contains
        value: skill:Terraform

  - vars:
      question: Is Sathish a good fit for a pure clinical role?
    assert:
      - type: javascript
        value: JSON.parse(output).fit === 'Weak' && JSON.parse(output).target === 'Pure clinical / licensed care delivery'
      - type: contains
        value: The RDF does not show a clinical license or direct care-delivery role.
      - type: not-contains
        value: '"fit": "Strong"'

  - vars:
      question: Is Sathish suitable for frontend brand design?
    assert:
      - type: javascript
        value: JSON.parse(output).fit === 'Weak' && JSON.parse(output).target === 'Frontend brand / visual design specialist'
      - type: contains
        value: Better fit for product engineering than pure brand or visual design.
      - type: not-contains
        value: '"target": "MedTech founder / biodesign program"'
