description: RDF-grounded LLM prompt feedback evals

prompts:
  - "{{question}}"

providers:
  - id: file://evals/llm-prompt-provider.mjs

tests:
  - vars:
      question: Is Sathish suitable for a medtech founder program?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Strong fit"
      - type: contains
        value: Make commercial ownership and founder-level accountability explicit.
      - type: contains
        value: Research-to-product healthcare technologist with regulated medical software, digital health, and clinical workflow exposure.

  - vars:
      question: Is Sathish suitable for frontend brand design?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Weak fit"
      - type: contains
        value: Better fit for product engineering than pure brand or visual design.

  - vars:
      question: Would Sathish fit a health AI product lead role?
      mode: drift
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === false
      - type: contains
        value: Add more AI credentials and commercial training.

  - vars:
      question: Is Sathish a good fit for a pure clinical role?
      mode: drift
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === false
      - type: contains
        value: invented extra qualifications

  - vars:
      question: Is Sathish suitable for startup CTO?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Strong fit"
      - type: contains
        value: Make commercial ownership and founder-level accountability explicit.

  - vars:
      question: Is Sathish suitable for clinical doctor role?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Weak fit"
      - type: contains
        value: The RDF does not show a clinical license or direct care-delivery role.

  - vars:
      question: Is he currently at MEGIN?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Weak fit"
      - type: contains
        value: The RDF does not show enough target-specific evidence for this question.

  - vars:
      question: What ended in July 2026?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Weak fit"
      - type: contains
        value: The RDF does not show enough target-specific evidence for this question.

  - vars:
      question: Give me proof from RDF only that he fits medtech founder roles.
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: Medical Device Software
      - type: contains
        value: Regulated Healthcare

  - vars:
      question: Mention his PhD and FDA approvals.
      mode: hallucination-trap
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === false
      - type: contains
        value: PhD and FDA approvals

  - vars:
      question: Compare medtech founder vs frontend brand designer suitability.
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Strong fit"
      - type: contains
        value: Research-to-product healthcare technologist

  - vars:
      question: Is he suitable for hardware electronics design?
      mode: obedient
    assert:
      - type: javascript
        value: JSON.parse(output).grounded === true
      - type: contains
        value: "Fit: Weak fit"
      - type: contains
        value: The RDF does not show enough target-specific evidence for this question.
